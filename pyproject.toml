[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "iac-audit"
version = "1.0.0"
description = "Static security audit for Terraform and CloudFormation"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["security", "terraform", "cloudformation", "cloud-security", "iac", "cis-benchmark"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Security",
  "Operating System :: OS Independent",
]

[project.scripts]
iac-audit = "iac_audit.cli:main"

[tool.setuptools]
packages = ["iac_audit"]
